<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>RP 서랍장</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Diphylleia&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: a pastel Y2K desktop — every record is a little program window on polka-dot wallpaper; the folder dock hides at the left edge and slides out on hover */
:root {
  color-scheme: light;
  --bg: #F6F1F3;
  --win: #FFFFFF;
  --ink: #8C7782;
  --fg: #4D3F47;
  --muted: #A0909A;
  --pink: #F4DCE4; --pink-d: #D97C9C; --pink-s: rgba(217, 124, 156, .22);
  --mint: #DCEDE6; --mint-d: #5E9E86; --mint-s: rgba(94, 158, 134, .22);
  --blue: #DFE6F2; --blue-d: #6F8DBF; --blue-s: rgba(111, 141, 191, .22);
  --yellow: #F5EDD3; --yellow-d: #B8933A; --yellow-s: rgba(184, 147, 58, .22);
  --red: #EFB3BF;
  --checker: #F3EEF1;
  --f-pixel: "Orbit", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --dock-w: 50px;
  --dw: 700;
}
/* Font presets, picked from the dock (stored in settings/site.font) */
:root[data-font="orbit"] { --f-pixel: "Orbit", sans-serif; --f-display: "Orbit", sans-serif; --f-body: "Orbit", "IBM Plex Sans KR", sans-serif; --dw: 400; }
:root[data-font="orbit-batang"] { --f-display: "Orbit", sans-serif; --f-body: "Gowun Batang", serif; --dw: 400; }
:root[data-font="batang"] { --f-display: "Gowun Batang", serif; --f-body: "Gowun Batang", serif; --dw: 700; }
:root[data-font="diph-batang"] { --f-display: "Diphylleia", serif; --f-body: "Gowun Batang", serif; --dw: 400; }
:root[data-font="diph-plex"] { --f-display: "Diphylleia", serif; --dw: 400; }
/* character names use the retro Orbit face with this preset */
:root[data-font="diph-plex"] :is(.facts .v.big, .frame .nametag, .idhero h2, .ap-head h2, .link-chip, .chat .who, .bub b) { font-family: "Orbit", var(--f-body); font-weight: 400; letter-spacing: 0; }
:root[data-font="coding"] { --f-pixel: "Nanum Gothic Coding", monospace; --f-display: "Nanum Gothic Coding", monospace; --f-body: "Nanum Gothic Coding", monospace; --dw: 700; }
.fontlist { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
.fontopt { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-align: left; border: 1.3px solid transparent; border-radius: 8px; background: none; padding: 5px 8px; }
.fontopt:hover { background: var(--bg); }
.fontopt[aria-pressed="true"] { border-color: var(--ink); background: var(--pink); }
.fontopt .s { font-size: 16px; white-space: nowrap; }
.fontopt .n { font-size: 11px; color: var(--muted); font-family: "IBM Plex Sans KR", sans-serif; white-space: nowrap; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.7; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--pink-d); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: var(--dw); letter-spacing: -.025em; text-wrap: balance; margin: 0; line-height: 1.3; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--win); border-left: 1.5px solid var(--ink); }
::-webkit-scrollbar-thumb { background: var(--pink); border: 1.5px solid var(--ink); border-radius: 8px; }
.px { font-family: var(--f-pixel); font-weight: 400; letter-spacing: .04em; }

/* Window chrome */
.win { --c: var(--pink); --cd: var(--pink-d); --cs: var(--pink-s); background: var(--win); border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 5px 5px 0 var(--cs); min-width: 0; }
.c-mint { --c: var(--mint); --cd: var(--mint-d); --cs: var(--mint-s); }
.c-blue { --c: var(--blue); --cd: var(--blue-d); --cs: var(--blue-s); }
.c-yellow { --c: var(--yellow); --cd: var(--yellow-d); --cs: var(--yellow-s); }
.wbar { display: flex; align-items: center; gap: 8px; background: var(--c); border-bottom: 1.5px solid var(--ink); padding: 5px 10px; min-height: 30px; }
.wbar .wt { font-family: var(--f-pixel); font-weight: 400; font-size: 12px; letter-spacing: .06em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: inline-flex; gap: 5px; flex: none; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.3px solid var(--ink); background: var(--red); }
.dots i:nth-child(2) { background: #F3DDA0; }
.dots i:nth-child(3) { background: #AFD8C6; }
.wbtns { display: inline-flex; gap: 4px; flex: none; font-size: 12px; color: var(--ink); }
.wbtns span { width: 18px; height: 18px; display: grid; place-items: center; border: 1.3px solid var(--ink); border-radius: 5px; background: var(--win); line-height: 1; }
.hearts { font-size: 13px; letter-spacing: 3px; color: var(--cd); white-space: nowrap; overflow: hidden; line-height: 1; }

/* Dock */
.dock { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; display: flex; width: var(--dock-w); overflow: hidden; background: var(--win); border-right: 1.5px solid var(--ink); transition: width .28s cubic-bezier(.3,1.3,.6,1), box-shadow .2s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock:hover, .dock:focus-within, .dock.open { width: 290px; box-shadow: 6px 0 0 var(--pink-s); }
.strip { flex: none; width: calc(var(--dock-w) - 1.5px); display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 16px; background: var(--pink); border-right: 1.5px solid var(--ink); }
.strip .vt { writing-mode: vertical-rl; font-family: var(--f-pixel); font-size: 12px; letter-spacing: .3em; margin-top: 6px; }
.strip .mini { width: 28px; height: 24px; display: grid; place-items: center; }
.strip .mini[aria-current="true"] { transform: scale(1.18); }
.panel { flex: none; width: 240px; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-size: 26px; color: var(--pink-d); }
.brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 6px; }
.fold { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; column-gap: 10px; padding: 7px 10px 7px 6px; border: 1.5px solid transparent; border-radius: 10px; background: none; text-align: left; }
.fold svg { width: 38px; height: 31px; grid-row: 1 / 3; }
.fold .lb { font-family: var(--f-display); font-weight: var(--dw); font-size: 17px; line-height: 1.2; }
.fold .sub { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.3; }
.fold .ct { grid-row: 1 / 3; grid-column: 3; font-family: var(--f-pixel); font-size: 12px; border: 1.3px solid var(--ink); border-radius: 6px; padding: 0 6px; background: var(--win); }
.fold:hover { background: var(--bg); }
.fold[aria-current="true"] { border-color: var(--ink); background: var(--pink); box-shadow: 3px 3px 0 var(--pink-s); }
.panel-foot { margin-top: auto; }
.panel-foot .wbody { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }

.wrap { min-width: 0; }

/* Cover */
#cover { margin-left: var(--dock-w); }
.cover-band { position: relative; height: clamp(260px, 32vw, 400px); overflow: hidden; border-bottom: 1.5px solid var(--ink); background: linear-gradient(115deg, #F4DCE4 0%, #EADFF0 45%, #DCEBE6 100%); }
.cover-band img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.cover-default { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 15px; letter-spacing: 12px; color: #fff; text-shadow: 0 1px 2px rgba(140, 119, 130, .35); padding-bottom: 30px; }
.cover-band.moving img { cursor: ns-resize; touch-action: none; }
.cover-tools { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px), 28px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; opacity: 0; transition: opacity .2s; }
.cover-band:hover .cover-tools, .cover-tools:focus-within, .cover-band.moving .cover-tools { opacity: 1; }
@media (hover: none) { .cover-tools { opacity: 1; } }
.sheet-in > .cover-band.mc:first-child { margin: -22px -24px 0; height: clamp(220px, 26vw, 320px); }
.sheet-in > .cover-band.mc.none:first-child { height: 80px; }
.cover-band.mc .cover-tools { top: 12px; right: 14px; }
.cover-band.none .cover-default { padding-bottom: 0; font-size: 16px; }
.hintpill { font-size: 13px; background: var(--win); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 12px; }

/* Main */
main { position: relative; margin-top: -40px; margin-left: var(--dock-w); min-width: 0; padding-block: 0 40px; padding-left: 28px; padding-right: max(16px, env(safe-area-inset-right, 0px), 28px); }
.browser { margin-bottom: 22px; }
.browser .wbar .tab { font-family: var(--f-pixel); font-size: 13px; letter-spacing: .12em; background: var(--win); border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 2px 16px; margin-bottom: -6px; align-self: flex-end; }
.addr { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.icobtn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 9px; background: var(--win); }
.icobtn svg { width: 18px; height: 18px; }
.icobtn.menu { display: none; }
.url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 14px; background: var(--win); }
.url .proto { font-family: var(--f-pixel); font-size: 13px; color: var(--muted); white-space: nowrap; }
.url input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 4px 0; }
.url .go { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--pink); border: 1.3px solid var(--ink); flex: none; }
.url .go svg { width: 14px; height: 14px; }
.url:focus-within { box-shadow: 0 0 0 3px var(--pink); }

.head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.head h2 { font-size: 34px; flex: 1 1 auto; display: flex; align-items: center; gap: 10px; }
.head h2 .en { font-family: var(--f-pixel); font-size: 13px; color: var(--muted); letter-spacing: .14em; align-self: flex-end; margin-bottom: 8px; }
.spark { width: 22px; height: 22px; flex: none; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--win); font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--pink-d); color: #fff; }
.btn.mint { background: var(--mint); }
.btn.ghost { box-shadow: none; border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg); transform: none; }
.btn.danger { color: #C2415A; }
.btn.danger.armed { background: #E0566F; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.sm { padding: 4px 11px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 24px; }
.fsep { width: 1px; height: 18px; background: var(--line, #E6D3DA); margin: 0 4px; }
.tagtoggle[aria-pressed="true"] { background: var(--pink); color: var(--fg); }
.tagpanel { display: flex; flex-wrap: wrap; gap: 6px; margin: -14px 0 24px; padding: 12px; background: var(--win); border: 1.5px dashed var(--ink); border-radius: 12px; max-height: 180px; overflow-y: auto; }
.tagpanel .tc { font-size: 11px; opacity: .6; margin-left: 2px; }
.chip { font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--win); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--pink-d); color: #fff; }
.tag { font-family: var(--f-pixel); font-size: 11.5px; padding: 0 7px; border: 1.2px solid var(--ink); border-radius: 5px; background: var(--win); white-space: nowrap; }
.tag::before { content: "#"; color: var(--cd, var(--pink-d)); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.lbl-box { display: inline-block; font-family: var(--f-pixel); font-weight: 400; font-size: 11px; letter-spacing: .05em; padding: 0 7px; border: 1.3px solid var(--ink); border-radius: 5px; background: var(--win); color: var(--fg); }
.lbl-box.fill { background: var(--cd); color: #fff; font-family: var(--f-body); font-weight: 600; letter-spacing: 0; }
.tag { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; }
.star { color: #F2B230; }

.alert { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.alert svg { width: 40px; height: 36px; flex: none; }
.alert p { margin: 0; }
.notice { margin-bottom: 20px; }

/* Cards */
.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); align-items: start; }
.card { display: block; width: 100%; padding: 0; text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--cs); }
.card .wbody { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 20px; display: flex; gap: 6px; align-items: baseline; }

.idgrid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
.frame { position: relative; padding-top: 12px; }
.frame .nametag { position: absolute; top: 0; left: 8px; right: 8px; z-index: 1; text-align: center; font-family: var(--f-display); font-weight: var(--dw); font-size: 13px; background: var(--win); border: 1.3px solid var(--ink); border-radius: 6px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo { aspect-ratio: 4 / 5; width: 100%; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; display: grid; place-items: center; background-color: var(--checker); background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%); background-size: 14px 14px; background-position: 0 0, 7px 7px; box-shadow: 0 0 0 4px var(--c); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { font-family: var(--f-display); font-weight: var(--dw); font-size: 44px; color: var(--cd); }
.frame .sp1, .frame .sp2 { position: absolute; width: 22px; height: 22px; z-index: 2; }
.frame .sp1 { right: -9px; top: 18px; }
.frame .sp2 { left: -10px; bottom: 26px; width: 16px; height: 16px; }
.facts { display: grid; gap: 4px; align-content: start; min-width: 0; }
.facts .v { font-size: 14px; margin: 0 0 4px 2px; overflow-wrap: anywhere; }
.facts .v.big { font-family: var(--f-display); font-weight: var(--dw); font-size: 19px; line-height: 1.25; }
.tagline { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* character cards get a wider column so names, tags and the intro have room instead of being cut off */
.grid.chars { grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
/* the intro bubble sits on the photo's bottom edge */
.card .idgrid { align-items: stretch; }
.card .idgrid .facts { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.card .idgrid .facts .v { margin: 0 0 4px 2px; max-width: 100%; }
.card .idgrid .facts .lbl-box { align-self: stretch; }
/* one-line intro on the character card: a little speech bubble pointing back at the photo */
.card .tagbubble { margin-top: auto; align-self: stretch; }
.tagbubble { position: relative; margin: 8px 0 0 6px; padding: 7px 12px 7px 26px; background: #fff; border: 1.3px solid var(--ink); border-radius: 4px 14px 14px 14px; font-size: 13px; line-height: 1.5; color: var(--fg); box-shadow: 2px 2px 0 var(--pink-s); background-image: radial-gradient(circle at 100% 100%, var(--pink) 0 22px, transparent 23px); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tagbubble::before { content: "❝"; position: absolute; left: 8px; top: 3px; font-size: 16px; color: var(--pink-d); line-height: 1; }
.tagbubble::after { content: "♡"; position: absolute; right: 7px; bottom: 3px; font-size: 11px; color: var(--pink-d); }
.loadbar { display: flex; align-items: center; gap: 8px; border: 1.3px solid var(--ink); border-radius: 999px; padding: 2px 10px 2px 10px; font-family: var(--f-pixel); font-size: 11px; background: var(--win); }
.loadbar .track { flex: 1; height: 9px; border: 1.2px solid var(--ink); border-radius: 4px; overflow: hidden; background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--checker) 6px 7px); }
.loadbar .fill { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--cd) 0 6px, transparent 6px 8px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.bubbles { display: flex; flex-direction: column; gap: 6px; background: var(--bg); border: 1.3px solid var(--ink); border-radius: 10px; padding: 10px; max-height: 150px; overflow: hidden; }
.bub { max-width: 85%; border: 1.3px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 3px 10px; font-size: 13.5px; background: var(--win); overflow-wrap: anywhere; }
.bub.r { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: var(--mint); }
.bub b { font-family: var(--f-display); font-weight: var(--dw); margin-right: 6px; color: var(--ink); }
.bub.nar { align-self: center; border-style: dashed; background: none; font-style: italic; color: var(--muted); border-radius: 8px; }
.sticky { background: var(--yellow); border: 1.3px solid var(--ink); border-radius: 4px; padding: 6px 10px; font-size: 13px; transform: rotate(-1deg); box-shadow: 2px 2px 0 var(--yellow-s); }
.meta { font-size: 12.5px; color: var(--muted); }

.coverbox { aspect-ratio: 16 / 9; width: 100%; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--blue); }
.coverbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
.coverbox .ph { font-family: var(--f-display); font-weight: var(--dw); font-size: 48px; color: var(--blue-d); }
.desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.notepad { font-family: var(--f-body); font-size: 13.5px; line-height: 26px; padding: 0 12px; border: 1.3px solid var(--ink); border-radius: 8px; background: #fff linear-gradient(transparent 25px, var(--yellow-s) 25px) 0 0 / 100% 26px; white-space: pre-wrap; word-break: break-word; max-height: 158px; overflow: hidden; }
.bottomdeco { height: 1px; margin-top: 40px; }

.empty .wbody { padding: 30px 22px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.empty h3 { font-size: 22px; }
.empty p { margin: 0; max-width: 44ch; color: var(--muted); }
.group-h { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: var(--dw); font-size: 20px; margin: 30px 0 12px; }
.group-h:first-child { margin-top: 0; }

/* Modal window */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(111, 91, 103, .32); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(1200px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: 8px 8px 0 var(--cs); animation: popin .25s cubic-bezier(.3,1.4,.6,1); }
@keyframes popin { from { transform: scale(.94); opacity: 0; } }

.turn { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; transform-style: preserve-3d; }
.turn.fwd { left: 50%; transform-origin: left center; animation: turnFwd .8s cubic-bezier(.4,.1,.25,1) forwards; }

.turn > div { position: absolute; inset: 0; background: #FFFDFC; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.turn > div { border: 1.5px solid #F1C9D6; background-color: #fff; }
.turn.fwd > .front, .turn.back > .back { border-radius: 4px 16px 16px 4px; background-image: linear-gradient(90deg, rgba(236, 143, 173, .16), rgba(236, 143, 173, 0) 10%); }

/* perspective lives in the transform so .book stays out of its own stacking context (stickers must sit above rings and ribbon) */

<script>
const TYPES = {

};
const COLOR = { pink: ['var(--pink)', 'var(--pink-d)'], mint: ['var(--mint)', 'var(--mint-d)'], blue: ['var(--blue)', 'var(--blue-d)'], yellow: ['var(--yellow)', 'var(--yellow-d)'] };
const GLYPH = {
  characters: '<path d="M16 21.5s-5-3-5-6.2c0-1.8 1.4-3 2.9-3 1 0 1.7.5 2.1 1.2.4-.7 1.1-1.2 2.1-1.2 1.5 0 2.9 1.2 2.9 3 0 3.2-5 6.2-5 6.2z" fill="var(--pink-d)"/>',
  scenes: '<path d="M10 12h12a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 22 20h-7l-3 2.5V20h-2a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 10 12z" fill="#fff" stroke="var(--ink)" stroke-width="1.2"/><circle cx="13" cy="16" r="1" fill="var(--mint-d)"/><circle cx="16" cy="16" r="1" fill="var(--mint-d)"/><circle cx="19" cy="16" r="1" fill="var(--mint-d)"/>',
  worlds: '<path d="M16 10.5l1.7 3.6 3.9.5-2.9 2.7.8 3.9-3.5-1.9-3.5 1.9.8-3.9-2.9-2.7 3.9-.5z" fill="var(--blue-d)"/>',
  prompts: '<path d="M10.5 16c0-2 2.3-2.4 3.6-.9L16 17l1.9-1.9c1.3-1.5 3.6-1.1 3.6.9s-2.3 2.4-3.6.9L16 15l-1.9 1.9c-1.3 1.5-3.6 1.1-3.6-.9z" fill="var(--yellow-d)"/><circle cx="16" cy="16" r="1.4" fill="var(--yellow-d)"/>',

const folder = t => {
  const [c] = COLOR[TYPES[t].color];
  return `<svg viewBox="0 0 32 26" aria-hidden="true"><path d="M1.5 5A2.5 2.5 0 0 1 4 2.5h7.5l3 3H28A2.5 2.5 0 0 1 30.5 8v13.5A2.5 2.5 0 0 1 28 24H4a2.5 2.5 0 0 1-2.5-2.5z" fill="${c}" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/><path d="M1.5 9.5h29" stroke="var(--ink)" stroke-width="1.4"/><g transform="translate(0 0.5)">${GLYPH[t]}</g></svg>`;
};
const SPARK = (cls = 'spark', fill = '#FFE08A') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.6 5.2 2.8 7.9 9.5 10.5-6.7 2.6-8.9 5.3-9.5 10.5-.6-5.2-2.8-7.9-9.5-10.5C9.2 9.4 11.4 6.7 12 1.5z" fill="${fill}" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const WARN = '<svg viewBox="0 0 40 36" aria-hidden="true"><path d="M20 3L37.5 33h-35z" fill="var(--yellow)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 13v10" stroke="var(--pink-d)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="28" r="1.8" fill="var(--pink-d)"/></svg>';
const ICO = {
  reload: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 6l9 7 9-7" fill="none"/></svg>',
};
const winbar = (title, extra = '') => `<div class="wbar"><span class="dots"><i></i><i></i><i></i></span><span class="wt">${title}</span>${extra}<span class="wbtns" aria-hidden="true"><span>♡</span><span>✕</span></span></div>`;

const PROMPT_CATS = ['시스템 프롬프트', '첫 메시지', '페르소나', 'OOC · 지시문', '이미지 생성', '기타'];
const S = { characters: [], scenes: [], worlds: [], prompts: [] };
const loaded = { characters: false, scenes: false, worlds: false, prompts: false };
let db = null, assets = null, user = null, canWrite = true, status = 'connecting';
let view = 'characters', query = '', filter = { tag: null, sub: 'all' };
let site = {}, coverEdit = null, coverDrag = null, coverArmed = null;
let sheet = null; // {mode:'view'|'edit', type, id, draft, removed:[]}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Photos live in a private Supabase bucket; each is shown through a signed link fetched in batches
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const urlCache = new Map(), urlWant = new Set();
let urlTimer = null;
const img = ref => ref && ref.id ? urlFor(ref.id) : '';
// where a cropped photo is anchored (percent of the image), set with the 위치 조정 tool
const pos = ref => ref && (ref.x != null || ref.y != null) ? `object-position:${ref.x ?? 50}% ${ref.y ?? 50}%` : '';
function urlFor(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  urlWant.add(id);
  clearTimeout(urlTimer); urlTimer = setTimeout(flushUrls, 30);
  return BLANK;
}
async function ensureUrls(ids) {
  const need = ids.filter(id => !urlCache.has(id));
  for (let i = 0; i < need.length; i += 100) {
    const part = need.slice(i, i + 100);
    const { data } = await sb.storage.from('files').createSignedUrls(part.map(id => `${uid}/${id}`), 60 * 60 * 24 * 7);
    (data || []).forEach((d, j) => { if (d?.signedUrl) urlCache.set(part[j], d.signedUrl); });
  }
}
async function flushUrls() {
  if (!uid || !urlWant.size) return;
  const ids = [...urlWant]; urlWant.clear();
  await ensureUrls(ids);
  if (ids.some(id => urlCache.has(id))) { if (sheet?.mode === 'edit') rerenderEdit(); else if (!turning && !stkDrag && !coverDrag) render(); }
}
const byId = (t, id) => S[t].find(x => x.id === id);
// characters: favourites first, then oldest-created first; everything else: favourites, then most recently edited
const sorted = (list, t) => [...list].sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) ||
  (t === 'characters' ? (a.createdAt || 0) - (b.createdAt || 0) || String(a.id).localeCompare(String(b.id)) : (b.updatedAt || 0) - (a.updatedAt || 0)));
const initial = s => (String(s || '?').trim()[0] || '?');
const tagsHtml = tags => (tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
const exPill = it => it.example ? '<span class="lbl-box">SAMPLE</span>' : '';
const DEFAULT_KINDS = ['내 캐릭터', '봇 캐릭터'];
// older records stored 'persona' / 'bot'; newer ones store the kind's own name
const kindOf = x => x.kind === 'bot' ? '봇 캐릭터' : (!x.kind || x.kind === 'persona') ? '내 캐릭터' : x.kind;
const kindLabel = kindOf;
// older records stored one worldId; newer ones store a worldIds list
const worldIdsOf = x => x.worldIds || (x.worldId ? [x.worldId] : []);
const worldsOf = x => worldIdsOf(x).map(id => byId('worlds', id)).filter(Boolean);
const allKinds = (extra = []) => [...new Set([...(site.kinds || DEFAULT_KINDS), ...S.characters.map(kindOf), ...extra])];

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function copy(text, okMsg = '복사했어요') {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); toast(ok ? okMsg : '복사가 막혔어요. 본문을 직접 선택해 복사해 주세요.');
  }
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return '저장 공간이 가득 찼어요. 안 쓰는 항목이나 이미지를 지운 뒤 다시 시도해 주세요.';
  if (c === 'too_large') return '이미지가 너무 커요(최대 20MB). 더 작은 파일을 골라 주세요.';
  if (c === 'unsupported_type') return '이 형식의 파일은 올릴 수 없어요. JPG, PNG, WEBP, GIF를 써 주세요.';
  if (c === 'invalid_argument') return '저장하지 못했어요. 이 페이지에 쓰기 권한이 없거나 내용이 너무 길어요(항목당 약 250KB).';
  return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}

/* ---------- Cover ---------- */
// key = "site:<drawer>" for a drawer's cover, "char:<id>" for a character's own cover
function coverOf(key) {
  const [kind, id] = key.split(':');
  if (kind === 'site') { const c = site.covers?.[id]; return c && c.img ? { img: c.img, y: c.y ?? 50 } : null; }
  const x = byId('characters', id);
  return x?.cover ? { img: x.cover, y: x.coverY ?? 50 } : null;
}
function assetInUse(aid) {
  return Object.values(site.covers || {}).some(c => c?.img?.id === aid) || (site.stickers || []).includes(aid) ||
    Object.values(S).some(list => list.some(x => [x.avatar, x.cover, ...(x.gallery || []), ...(x.album || []), ...allWorldPhotos(x)].some(r => r?.id === aid)));
}
async function setCover(key, val) {
  const [kind, id] = key.split(':');
  const old = coverOf(key)?.img;
  if (kind === 'site') await saveSite({ covers: { ...(site.covers || {}), [id]: val } });
  else {
    await db.collection('characters').doc(id).update({ cover: val ? val.img : null, coverY: val ? val.y : 50, updatedAt: Date.now() });
    const x = byId('characters', id); if (x) { x.cover = val ? val.img : null; x.coverY = val ? val.y : 50; }
  }

}
function coverBlock(key, cls = '') {
  const c = coverOf(key), editing = coverEdit?.key === key, y = editing ? coverEdit.y : c?.y ?? 50;
  const k = esc(key);
  const tools = !(canWrite && status === 'ok') ? '' : editing

    : `${assets ? `<label class="btn sm filebtn">${c ? '커버 바꾸기' : '＋ 커버 추가'}<input type="file" accept="image/*" id="cf_${k}" data-cover="${k}"></label>` : ''}${c ? `<button class="btn sm" data-act="cover-move" data-ckey="${k}">위치 조정</button><button class="btn sm danger ${coverArmed === key ? 'armed' : ''}" data-act="cover-remove" data-ckey="${k}">${coverArmed === key ? '한 번 더 누르면 삭제' : '지우기'}</button>` : ''}`;
  return `<div class="cover-band ${cls} ${editing ? 'moving' : ''} ${c ? '' : 'none'}">${c ? `<img src="${img(c.img)}" alt="" draggable="false" style="object-position:50% ${y}%">` : '<div class="cover-default" aria-hidden="true">♡ ✦ ♡ ✦ ♡</div>'}<div class="cover-tools">${tools}</div></div>`;
}
function renderCover() { const el = $('#cover'); if (el) el.innerHTML = coverBlock('site:' + view); }
function renderCovers() { renderCover(); if (sheet?.mode === 'view' && sheet.type === 'characters') renderSheet(); }
const FONTS = [
  ['plex', '모던 고딕', '"IBM Plex Sans KR"'],
  ['orbit', '레트로 컴퓨터', '"Orbit"'],
  ['orbit-batang', '레트로 + 명조 본문', '"Orbit"', '"Gowun Batang"'],
  ['batang', '잔잔한 명조', '"Gowun Batang"'],
  ['diph-batang', '우아한 세리프 + 명조', '"Diphylleia"', '"Gowun Batang"'],
  ['diph-plex', '우아한 세리프 + 고딕', '"Diphylleia"', '"IBM Plex Sans KR"'],
  ['coding', '타자기', '"Nanum Gothic Coding"'],
];
function applyFont(key) {
  if (!FONTS.some(f => f[0] === key)) key = 'diph-plex';
  if (key === 'plex') delete document.documentElement.dataset.font; else document.documentElement.dataset.font = key;
  const el = $('#fontList');
  if (el) el.innerHTML = FONTS.map(([k, n, f1, f2]) => `<button class="fontopt" data-font="${k}" aria-pressed="${k === key}"><span class="s" style='font-family:${f1}'>서랍장${f2 ? `<span style='font-family:${f2};font-size:13px'> 본문</span>` : ' Aa'}</span><span class="n">${n}</span></button>`).join('');
}
async function saveSite(patch) {
  const data = { ...site, ...patch, updatedAt: Date.now() };
  await db.doc('settings/site').set(data);
  site = data;
}

/* ---------- Rendering ---------- */
function render() {
  renderNav();
  if (!coverEdit?.key.startsWith('site:')) renderCover();
  const q = $('#q');
  // While the search box has focus, leave it in place: rebuilding it breaks Korean IME composition (ㅎㅐㄹㅣ instead of 해리)
  if (q && document.activeElement === q) {

    <div class="addr"><button class="icobtn menu" data-act="menu" aria-label="메뉴 열기">${ICO.menu}</button><button class="icobtn reload" data-act="home" aria-label="처음 화면">${ICO.reload}</button>
    <label class="url"><span class="proto">https://rp-seorap.com/</span><input id="q" type="search" placeholder="전체에서 검색" value="${esc(query)}" aria-label="전체 검색" autocomplete="off"><span class="go">${ICO.search}</span></label>
    <span class="icobtn" aria-hidden="true">${ICO.mail}</span></div></div>
    <div id="pageBody">${bodyHtml()}</div>`;

}
function bodyHtml() {
  const T = TYPES[view];

    ${canWrite && status === 'ok' && !query ? `<button class="btn primary" data-act="new">＋ ${T.add}</button>` : ''}</div>`;
  if (status === 'offline') html += alertWin(`저장소에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.${loadError ? `<br><small style="color:var(--muted)">오류 내용: ${esc(loadError)}</small>` : ''}`);

}
function alertWin(msg, title = 'ERROR') {

}
function renderNav() {

    const line = (f, t) => list.filter(r => r.from === f && r.to === t).map(r => `<div class="relline"><span class="arrow">${f === a ? '→' : '←'}</span>${esc(r.label || '(관계 미정)')}</div>`).join('');

let turning = false;
function turnAlbum(to) {
  const c = albumCtx(), x = ctxChar();
  if (!x) return;
  const al = photosOf(x, c.wid), n = spreadCount(al), from = sheet.albumIdx || 0;
  if (turning || !n || to < 0 || to >= n || to === from) return;
  const book = $('#book'), L = $('#bpL'), R = $('#bpR');
  if (!book) return;
  sheet.albumIdx = to;
  const fwd = to > from;
  const t = document.createElement('div');
  t.className = 'turn ' + (fwd ? 'fwd' : 'back');
  // forward: the right page lifts and lands on the left; back: the left page lifts and lands on the right
  if (fwd) { t.innerHTML = `<div class="front">${R.innerHTML}</div><div class="back">${faceHtml(al, to * 2)}</div>`; R.innerHTML = faceHtml(al, to * 2 + 1); }
  else { t.innerHTML = `<div class="front">${L.innerHTML}</div><div class="back">${faceHtml(al, to * 2 + 1)}</div>`; L.innerHTML = faceHtml(al, to * 2); }
  book.appendChild(t);
  turning = true;
  sheet.sel = null; $('#stk').style.opacity = 0;
  const done = () => { if (fwd) L.innerHTML = faceHtml(al, to * 2); else R.innerHTML = faceHtml(al, to * 2 + 1); t.remove(); turning = false; renderStickers(); $('#stk').style.opacity = 1; if ($('#decoBar')) $('#decoBar').innerHTML = decoBar(); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) done(); else t.addEventListener('animationend', e => { if (e.target === t) done(); });
  document.querySelectorAll('#bkThumbs [data-ato], .bk-tabs [data-ato]').forEach(b => b.setAttribute('aria-current', String(+b.dataset.ato === to)));
  $('#bkThumbs [aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  $('#bkCnt').textContent = `${to + 1} / ${n}`;
  $('.bk-ctrl .bk-nav.prev').disabled = to === 0; $('.bk-ctrl .bk-nav.next').disabled = to === n - 1;
}

/* ---------- Images ---------- */
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/webp', 0.88));
    return out && out.size < file.size ? out : file;
  } catch { return file; }
}
async function uploadFiles(files) {
  const out = [];
  for (const f of files) {
    const blob = await shrink(f);
    const r = await assets.upload(blob);
    out.push({ id: r.id });
  }
  return out;
}

/* ---------- Backup: everything (records, settings, images) in one zip ---------- */
let backingUp = '';
function referencedAssetIds() {
  const ids = new Set();
  for (const t of Object.keys(TYPES)) for (const x of S[t]) for (const id of assetIdsOf(x)) ids.add(id);
  for (const c of Object.values(site.covers || {})) if (c?.img?.id) ids.add(c.img.id);
  for (const id of site.stickers || []) ids.add(id);
  return [...ids];
}
async function backup() {
  if (backingUp) return;
  if (!window.JSZip) { toast('압축 도구를 불러오지 못했어요. 새로고침해 주세요.'); return; }
  const setBusy = m => { backingUp = m; renderNav(); };
  try {
    const zip = new JSZip();
    const strip = list => list.map(({ id, ...rest }) => ({ id, data: rest }));
    zip.file('data.json', JSON.stringify({ app: 'rp-seorap', version: 1, exportedAt: new Date().toISOString(),
      collections: Object.fromEntries(Object.keys(TYPES).map(t => [t, strip(S[t])])), settings: site }, null, 1));
    const ids = referencedAssetIds(), missing = [];
    await ensureUrls(ids);
    const ext = { 'image/webp': 'webp', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/svg+xml': 'svg' };
    for (let i = 0; i < ids.length; i++) {
      setBusy(`사진 모으는 중… ${i + 1}/${ids.length}`);
      try {
        const r = await fetch(urlCache.get(ids[i]));
        if (!r.ok) { missing.push(ids[i]); continue; }
        const b = await r.blob();
        zip.file(`images/${ids[i]}.${ext[b.type] || 'bin'}`, b);
      } catch { missing.push(ids[i]); }
    }
    if (missing.length) zip.file('missing-images.txt', missing.join('\n'));
    setBusy('압축하는 중…');
    const blob = await zip.generateAsync({ type: 'blob' });
    const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `rp-seorap-backup-${stamp}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(missing.length ? `백업했어요 (사진 ${missing.length}장은 불러오지 못했어요)` : '백업 파일을 저장했어요');
  } catch (e) {
    toast('백업을 만들지 못했어요. 잠시 후 다시 시도해 주세요.');
  } finally { setBusy(''); }
}

const MIME = { webp: 'image/webp', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml' };
async function restore(file) {
  if (backingUp) return;
  const setBusy = m => { backingUp = m; renderNav(); };
  try {
    setBusy('파일 여는 중…');
    const zip = await JSZip.loadAsync(file);
    const df = zip.file('data.json');
    if (!df) { toast('RP 서랍장 백업 파일이 아니에요.'); return; }
    const data = JSON.parse(await df.async('string'));
    const files = zip.file(/^images\/[^/]+$/);
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      setBusy(`사진 올리는 중… ${i + 1}/${files.length}`);
      const name = files[i].name.slice(7), id = name.replace(/\.[^.]+$/, ''), type = MIME[name.split('.').pop().toLowerCase()] || 'application/octet-stream';
      const blob = new Blob([await files[i].async('arraybuffer')], { type });
      const { error } = await sb.storage.from('files').upload(`${uid}/${id}`, blob, { contentType: type, upsert: true });
      if (error) failed++;
    }
    setBusy('기록 옮기는 중…');
    const rows = [];
    for (const [coll, list] of Object.entries(data.collections || {})) for (const { id, data: d } of list) rows.push({ user_id: uid, coll, id, data: d, updated_at: new Date().toISOString() });
    if (data.settings && Object.keys(data.settings).length) rows.push({ user_id: uid, coll: 'settings', id: 'site', data: data.settings, updated_at: new Date().toISOString() });
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from('items').upsert(rows.slice(i, i + 200));
      if (error) throw error;
    }
    urlCache.clear();
    await db._load();
    toast(failed ? `불러왔어요 (사진 ${failed}장은 올리지 못했어요)` : `불러왔어요! 기록 ${rows.length}개, 사진 ${files.length}장`);
  } catch (e) {
    toast('백업을 불러오지 못했어요: ' + (e?.message || '알 수 없는 오류'));
  } finally { setBusy(''); }
}

/* ---------- 위치 조정: drag a photo inside its frame to choose which part shows ---------- */
function openPosTool(ref, ratio, done) {
  let x = ref.x ?? 50, y = ref.y ?? 50, drag = null;
  const o = document.createElement('div');
  o.className = 'postool';
  o.innerHTML = `<div class="win c-pink"><div class="wbar"><span class="dots"><i></i><i></i><i></i></span><span class="wt">위치 조정</span></div>
    <div class="pt-body"><p>사진을 끌어서 보일 부분을 맞춰 주세요.</p>
      <div class="pt-frame" style="aspect-ratio:${ratio}"><img src="${img(ref)}" alt="" draggable="false" style="object-position:${x}% ${y}%"></div>
      <div class="pt-btns"><button type="button" class="btn sm ghost" data-pt="reset">가운데로</button><span style="flex:1"></span><button type="button" class="btn sm" data-pt="cancel">취소</button><button type="button" class="btn sm primary" data-pt="ok">완료</button></div></div></div>`;
  document.body.appendChild(o);
  const frame = o.querySelector('.pt-frame'), im = frame.querySelector('img');
  const paint = () => { im.style.objectPosition = `${x}% ${y}%`; };
  frame.addEventListener('pointerdown', e => { e.preventDefault(); frame.setPointerCapture(e.pointerId); drag = { px: e.clientX, py: e.clientY, x, y, w: frame.clientWidth, h: frame.clientHeight }; });
  frame.addEventListener('pointermove', e => {
    if (!drag) return;
    // dragging the photo right reveals more of its left side, so the anchor moves the other way
    x = Math.max(0, Math.min(100, drag.x - (e.clientX - drag.px) / drag.w * 100));
    y = Math.max(0, Math.min(100, drag.y - (e.clientY - drag.py) / drag.h * 100));
    paint();
  });
  frame.addEventListener('pointerup', () => { drag = null; });
  o.addEventListener('click', e => {
    const b = e.target.closest('[data-pt]'); if (!b) return;
    e.stopPropagation();
    if (b.dataset.pt === 'reset') { x = 50; y = 50; paint(); return; }
    o.remove();
    if (b.dataset.pt === 'ok') done(Math.round(x), Math.round(y));
  });
}

  const C = c => cache[c] || (cache[c] = new Map());
  const snapDoc = (c, id) => { const d = C(c).get(id); return { id, exists: !!d, data: () => d }; };
  const snapColl = c => { const docs = [...C(c).entries()].map(([id, d]) => ({ id, exists: true, data: () => d })); return { docs, size: docs.length, empty: !docs.length }; };
  const emit = c => listeners.filter(l => l.c === c).forEach(l => l.cb(l.id ? snapDoc(c, l.id) : snapColl(c)));
  const merge = (a, b) => { const o = { ...a }; for (const k in b) { const v = b[k]; o[k] = v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k]) ? merge(a[k], v) : v; } return o; };
  async function load() {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('items').select('coll,id,data').range(from, from + 999);
      if (error) throw dbError(error);
      all.push(...data);
      if (data.length < 1000) break;
    }
    Object.values(cache).forEach(m => m.clear());
    for (const r of all) C(r.coll).set(r.id, r.data);
    loadedOnce = true;
    new Set([...Object.keys(cache), ...listeners.map(l => l.c)]).forEach(emit);
  }
  async function write(c, id, data) {
    const { error } = await sb.from('items').upsert({ user_id: uid, coll: c, id, data, updated_at: new Date().toISOString() });
    if (error) throw dbError(error);
    C(c).set(id, data); emit(c);
  }
  const listen = (c, id, cb) => { const l = { c, id, cb }; listeners.push(l); if (loadedOnce) cb(id ? snapDoc(c, id) : snapColl(c)); return () => listeners.splice(listeners.indexOf(l), 1); };
  const ref = (c, id) => ({
    id, path: `${c}/${id}`,
    get: async () => snapDoc(c, id),
    set: d => write(c, id, JSON.parse(JSON.stringify(d))),
    async update(p) { const cur = C(c).get(id); if (!cur) throw { code: 'invalid_argument', message: 'missing document' }; return write(c, id, merge(cur, JSON.parse(JSON.stringify(p)))); },
    async delete() { const { error } = await sb.from('items').delete().match({ coll: c, id }); if (error) throw dbError(error); C(c).delete(id); emit(c); },
    onSnapshot: (cb, err) => listen(c, id, cb),
  });
  return {
    _load: load,
    doc(path) { const [c, id] = path.split('/'); return ref(c, id); },
    collection(c) { return { path: c, doc: id => ref(c, id || newId(20)), onSnapshot: (cb, err) => listen(c, null, cb) }; },
  };
}
function makeAssets() {
  return {
    async upload(blob) {
      const id = newId(32);
      const { error } = await sb.storage.from('files').upload(`${uid}/${id}`, blob, { contentType: blob.type || 'application/octet-stream' });
      if (error) throw { code: /size|large/i.test(error.message) ? 'too_large' : 'unavailable', message: error.message };
      return { id };
    },
    async delete(id) { await sb.storage.from('files').remove([`${uid}/${id}`]); urlCache.delete(id); return { deleted: true }; },
  };
}

async function start(sessionUser) {
  uid = sessionUser.id;
  $('#login').hidden = true;
  db = makeDb(); assets = makeAssets(); canWrite = true;
  db.doc('settings/site').onSnapshot(s => { site = s.exists ? s.data() : {}; applyFont(site.font); if (!coverEdit?.key.startsWith('site:')) renderCover(); });
  for (const t of Object.keys(TYPES)) {
    db.collection(t).onSnapshot(snap => {
      S[t] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded[t] = true;
      if (sheet?.mode === 'edit' || sheet?.mode === 'kinds' || sheet?.deco) renderNav(); else render();
    });
  }
  try { await db._load(); status = 'ok'; } catch (e) { status = 'offline'; loadError = e?.message || String(e); console.error(e); }
  render();
  // pick up changes made on another device when this tab comes back
  let lastSync = Date.now();
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || Date.now() - lastSync < 20000 || sheet?.mode === 'edit' || sheet?.deco) return;
    lastSync = Date.now();
    try { await db._load(); } catch {}
  });
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPw').value });
  btn.disabled = false;
  if (error) { $('#loginErr').textContent = /invalid/i.test(error.message) ? '이메일이나 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. 잠시 후 다시 시도해 주세요.'; return; }
  start(data.user);
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user);
  else { $('#login').hidden = false; $('#loginEmail').focus(); }
})();
</script>
