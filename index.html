<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 26'%3E%3Cpath d='M1.5 5A2.5 2.5 0 0 1 4 2.5h7.5l3 3H28A2.5 2.5 0 0 1 30.5 8v13.5A2.5 2.5 0 0 1 28 24H4a2.5 2.5 0 0 1-2.5-2.5z' fill='%23F4DCE4' stroke='%238C7782' stroke-width='1.6'/%3E%3Cpath d='M16 22s-5-3-5-6.2c0-1.8 1.4-3 2.9-3 1 0 1.7.5 2.1 1.2.4-.7 1.1-1.2 2.1-1.2 1.5 0 2.9 1.2 2.9 3 0 3.2-5 6.2-5 6.2z' fill='%23D97C9C'/%3E%3C/svg%3E">
<title>RP 서랍장</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Diphylleia&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: a pastel Y2K desktop — every record is a little program window on polka-dot wallpaper; the folder dock hides at the left edge and slides out on hover */
:root {
  color-scheme: light;
  --bg: #F6F1F3;
  --win: #FFFFFF;
  --ink: #8C7782;
  --fg: #4D3F47;
  --muted: #A0909A;
  --pink: #F4DCE4; --pink-d: #D97C9C; --pink-s: rgba(217, 124, 156, .22);
  --mint: #DCEDE6; --mint-d: #5E9E86; --mint-s: rgba(94, 158, 134, .22);
  --blue: #DFE6F2; --blue-d: #6F8DBF; --blue-s: rgba(111, 141, 191, .22);
  --yellow: #F5EDD3; --yellow-d: #B8933A; --yellow-s: rgba(184, 147, 58, .22);
  --red: #EFB3BF;
  --checker: #F3EEF1;
  --f-pixel: "Orbit", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --dock-w: 50px;
  --dw: 700;
}
/* Font presets, picked from the dock (stored in settings/site.font) */
:root[data-font="orbit"] { --f-pixel: "Orbit", sans-serif; --f-display: "Orbit", sans-serif; --f-body: "Orbit", "IBM Plex Sans KR", sans-serif; --dw: 400; }
:root[data-font="orbit-batang"] { --f-display: "Orbit", sans-serif; --f-body: "Gowun Batang", serif; --dw: 400; }
:root[data-font="batang"] { --f-display: "Gowun Batang", serif; --f-body: "Gowun Batang", serif; --dw: 700; }
:root[data-font="diph-batang"] { --f-display: "Diphylleia", serif; --f-body: "Gowun Batang", serif; --dw: 400; }
:root[data-font="diph-plex"] { --f-display: "Diphylleia", serif; --dw: 400; }
/* character names use the retro Orbit face with this preset */
:root[data-font="diph-plex"] :is(.facts .v.big, .frame .nametag, .idhero h2, .ap-head h2, .link-chip, .chat .who, .bub b) { font-family: "Orbit", var(--f-body); font-weight: 400; letter-spacing: 0; }
:root[data-font="coding"] { --f-pixel: "Nanum Gothic Coding", monospace; --f-display: "Nanum Gothic Coding", monospace; --f-body: "Nanum Gothic Coding", monospace; --dw: 700; }
.fontlist { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
.fontopt { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-align: left; border: 1.3px solid transparent; border-radius: 8px; background: none; padding: 5px 8px; }
.fontopt:hover { background: var(--bg); }
.fontopt[aria-pressed="true"] { border-color: var(--ink); background: var(--pink); }
.fontopt .s { font-size: 16px; white-space: nowrap; }
.fontopt .n { font-size: 11px; color: var(--muted); font-family: "IBM Plex Sans KR", sans-serif; white-space: nowrap; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.7; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--pink-d); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: var(--dw); letter-spacing: -.025em; text-wrap: balance; margin: 0; line-height: 1.3; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--win); border-left: 1.5px solid var(--ink); }
::-webkit-scrollbar-thumb { background: var(--pink); border: 1.5px solid var(--ink); border-radius: 8px; }
.px { font-family: var(--f-pixel); font-weight: 400; letter-spacing: .04em; }

/* Window chrome */
.win { --c: var(--pink); --cd: var(--pink-d); --cs: var(--pink-s); background: var(--win); border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 5px 5px 0 var(--cs); min-width: 0; }
.c-mint { --c: var(--mint); --cd: var(--mint-d); --cs: var(--mint-s); }
.c-blue { --c: var(--blue); --cd: var(--blue-d); --cs: var(--blue-s); }
.c-yellow { --c: var(--yellow); --cd: var(--yellow-d); --cs: var(--yellow-s); }
.wbar { display: flex; align-items: center; gap: 8px; background: var(--c); border-bottom: 1.5px solid var(--ink); padding: 5px 10px; min-height: 30px; }
.wbar .wt { font-family: var(--f-pixel); font-weight: 400; font-size: 12px; letter-spacing: .06em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: inline-flex; gap: 5px; flex: none; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.3px solid var(--ink); background: var(--red); }
.dots i:nth-child(2) { background: #F3DDA0; }
.dots i:nth-child(3) { background: #AFD8C6; }
.wbtns { display: inline-flex; gap: 4px; flex: none; font-size: 12px; color: var(--ink); }
.wbtns span { width: 18px; height: 18px; display: grid; place-items: center; border: 1.3px solid var(--ink); border-radius: 5px; background: var(--win); line-height: 1; }
.hearts { font-size: 13px; letter-spacing: 3px; color: var(--cd); white-space: nowrap; overflow: hidden; line-height: 1; }

/* Dock */
.dock { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; display: flex; width: var(--dock-w); overflow: hidden; background: var(--win); border-right: 1.5px solid var(--ink); transition: width .28s cubic-bezier(.3,1.3,.6,1), box-shadow .2s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock:hover, .dock:focus-within, .dock.open { width: 290px; box-shadow: 6px 0 0 var(--pink-s); }
.strip { flex: none; width: calc(var(--dock-w) - 1.5px); display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 16px; background: var(--pink); border-right: 1.5px solid var(--ink); }
.strip .vt { writing-mode: vertical-rl; font-family: var(--f-pixel); font-size: 12px; letter-spacing: .3em; margin-top: 6px; }
.strip .mini { width: 28px; height: 24px; display: grid; place-items: center; }
.strip .mini[aria-current="true"] { transform: scale(1.18); }
.panel { flex: none; width: 240px; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-size: 26px; color: var(--pink-d); }
.brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 6px; }
.fold { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; column-gap: 10px; padding: 7px 10px 7px 6px; border: 1.5px solid transparent; border-radius: 10px; background: none; text-align: left; }
.fold svg { width: 38px; height: 31px; grid-row: 1 / 3; }
.fold .lb { font-family: var(--f-display); font-weight: var(--dw); font-size: 17px; line-height: 1.2; }
.fold .sub { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.3; }
.fold .ct { grid-row: 1 / 3; grid-column: 3; font-family: var(--f-pixel); font-size: 12px; border: 1.3px solid var(--ink); border-radius: 6px; padding: 0 6px; background: var(--win); }
.fold:hover { background: var(--bg); }
.fold[aria-current="true"] { border-color: var(--ink); background: var(--pink); box-shadow: 3px 3px 0 var(--pink-s); }
.panel-foot { margin-top: auto; }
.panel-foot .wbody { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }

.wrap { min-width: 0; }

/* Cover */
#cover { margin-left: var(--dock-w); }
.cover-band { position: relative; height: clamp(260px, 32vw, 400px); overflow: hidden; border-bottom: 1.5px solid var(--ink); background: linear-gradient(115deg, #F4DCE4 0%, #EADFF0 45%, #DCEBE6 100%); }
.cover-band img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.cover-default { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 15px; letter-spacing: 12px; color: #fff; text-shadow: 0 1px 2px rgba(140, 119, 130, .35); padding-bottom: 30px; }
.cover-band.moving img { cursor: ns-resize; touch-action: none; }
.cover-tools { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px), 28px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; opacity: 0; transition: opacity .2s; }
.cover-band:hover .cover-tools, .cover-tools:focus-within, .cover-band.moving .cover-tools { opacity: 1; }
@media (hover: none) { .cover-tools { opacity: 1; } }
.sheet-in > .cover-band.mc:first-child { margin: -22px -24px 0; height: clamp(220px, 26vw, 320px); }
.sheet-in > .cover-band.mc.none:first-child { height: 80px; }
.cover-band.mc .cover-tools { top: 12px; right: 14px; }
.cover-band.none .cover-default { padding-bottom: 0; font-size: 16px; }
.hintpill { font-size: 13px; background: var(--win); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 12px; }

/* Main */
main { position: relative; margin-top: -40px; margin-left: var(--dock-w); min-width: 0; padding-block: 0 40px; padding-left: 28px; padding-right: max(16px, env(safe-area-inset-right, 0px), 28px); }
.browser { margin-bottom: 22px; }
.browser .wbar .tab { font-family: var(--f-pixel); font-size: 13px; letter-spacing: .12em; background: var(--win); border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 2px 16px; margin-bottom: -6px; align-self: flex-end; }
.addr { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.icobtn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 9px; background: var(--win); }
.icobtn svg { width: 18px; height: 18px; }
.icobtn.menu { display: none; }
.url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 14px; background: var(--win); }
.url .proto { font-family: var(--f-pixel); font-size: 13px; color: var(--muted); white-space: nowrap; }
.url input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 4px 0; }
.url .go { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--pink); border: 1.3px solid var(--ink); flex: none; }
.url .go svg { width: 14px; height: 14px; }
.url:focus-within { box-shadow: 0 0 0 3px var(--pink); }

.head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.head h2 { font-size: 34px; flex: 1 1 auto; display: flex; align-items: center; gap: 10px; }
.head h2 .en { font-family: var(--f-pixel); font-size: 13px; color: var(--muted); letter-spacing: .14em; align-self: flex-end; margin-bottom: 8px; }
.spark { width: 22px; height: 22px; flex: none; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--win); font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--pink-d); color: #fff; }
.btn.mint { background: var(--mint); }
.btn.ghost { box-shadow: none; border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg); transform: none; }
.btn.danger { color: #C2415A; }
.btn.danger.armed { background: #E0566F; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.sm { padding: 4px 11px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 24px; }
.fsep { width: 1px; height: 18px; background: var(--line, #E6D3DA); margin: 0 4px; }
.tagtoggle[aria-pressed="true"] { background: var(--pink); color: var(--fg); }
.tagpanel { display: flex; flex-wrap: wrap; gap: 6px; margin: -14px 0 24px; padding: 12px; background: var(--win); border: 1.5px dashed var(--ink); border-radius: 12px; max-height: 180px; overflow-y: auto; }
.tagpanel .tc { font-size: 11px; opacity: .6; margin-left: 2px; }
.chip { font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--win); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--pink-d); color: #fff; }
.tag { font-family: var(--f-pixel); font-size: 11.5px; padding: 0 7px; border: 1.2px solid var(--ink); border-radius: 5px; background: var(--win); white-space: nowrap; }
.tag::before { content: "#"; color: var(--cd, var(--pink-d)); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.lbl-box { display: inline-block; font-family: var(--f-pixel); font-weight: 400; font-size: 11px; letter-spacing: .05em; padding: 0 7px; border: 1.3px solid var(--ink); border-radius: 5px; background: var(--win); color: var(--fg); }
.lbl-box.fill { background: var(--cd); color: #fff; font-family: var(--f-body); font-weight: 600; letter-spacing: 0; }
.tag { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; }
.star { color: #F2B230; }

.alert { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.alert svg { width: 40px; height: 36px; flex: none; }
.alert p { margin: 0; }
.notice { margin-bottom: 20px; }

/* Cards */
.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); align-items: start; }
.card { display: block; width: 100%; padding: 0; text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--cs); }
.card .wbody { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 20px; display: flex; gap: 6px; align-items: baseline; }

.idgrid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
.frame { position: relative; padding-top: 12px; }
.frame .nametag { position: absolute; top: 0; left: 8px; right: 8px; z-index: 1; text-align: center; font-family: var(--f-display); font-weight: var(--dw); font-size: 13px; background: var(--win); border: 1.3px solid var(--ink); border-radius: 6px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo { aspect-ratio: 4 / 5; width: 100%; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; display: grid; place-items: center; background-color: var(--checker); background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%); background-size: 14px 14px; background-position: 0 0, 7px 7px; box-shadow: 0 0 0 4px var(--c); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { font-family: var(--f-display); font-weight: var(--dw); font-size: 44px; color: var(--cd); }
.frame .sp1, .frame .sp2 { position: absolute; width: 22px; height: 22px; z-index: 2; }
.frame .sp1 { right: -9px; top: 18px; }
.frame .sp2 { left: -10px; bottom: 26px; width: 16px; height: 16px; }
.facts { display: grid; gap: 4px; align-content: start; min-width: 0; }
.facts .v { font-size: 14px; margin: 0 0 4px 2px; overflow-wrap: anywhere; }
.facts .v.big { font-family: var(--f-display); font-weight: var(--dw); font-size: 19px; line-height: 1.25; }
.tagline { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* character cards get a wider column so names, tags and the intro have room instead of being cut off */
.grid.chars { grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
/* the intro bubble sits on the photo's bottom edge */
.card .idgrid { align-items: stretch; }
.card .idgrid .facts { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.card .idgrid .facts .v { margin: 0 0 4px 2px; max-width: 100%; }
.card .idgrid .facts .lbl-box { align-self: stretch; }
/* one-line intro on the character card: a little speech bubble pointing back at the photo */
.card .tagbubble { margin-top: auto; align-self: stretch; }
.tagbubble { position: relative; margin: 8px 0 0 6px; padding: 7px 12px 7px 26px; background: #fff; border: 1.3px solid var(--ink); border-radius: 4px 14px 14px 14px; font-size: 13px; line-height: 1.5; color: var(--fg); box-shadow: 2px 2px 0 var(--pink-s); background-image: radial-gradient(circle at 100% 100%, var(--pink) 0 22px, transparent 23px); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tagbubble::before { content: "❝"; position: absolute; left: 8px; top: 3px; font-size: 16px; color: var(--pink-d); line-height: 1; }
.tagbubble::after { content: "♡"; position: absolute; right: 7px; bottom: 3px; font-size: 11px; color: var(--pink-d); }
.loadbar { display: flex; align-items: center; gap: 8px; border: 1.3px solid var(--ink); border-radius: 999px; padding: 2px 10px 2px 10px; font-family: var(--f-pixel); font-size: 11px; background: var(--win); }
.loadbar .track { flex: 1; height: 9px; border: 1.2px solid var(--ink); border-radius: 4px; overflow: hidden; background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--checker) 6px 7px); }
.loadbar .fill { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--cd) 0 6px, transparent 6px 8px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.bubbles { display: flex; flex-direction: column; gap: 6px; background: var(--bg); border: 1.3px solid var(--ink); border-radius: 10px; padding: 10px; max-height: 150px; overflow: hidden; }
.bub { max-width: 85%; border: 1.3px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 3px 10px; font-size: 13.5px; background: var(--win); overflow-wrap: anywhere; }
.bub.r { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: var(--mint); }
.bub b { font-family: var(--f-display); font-weight: var(--dw); margin-right: 6px; color: var(--ink); }
.bub.nar { align-self: center; border-style: dashed; background: none; font-style: italic; color: var(--muted); border-radius: 8px; }
.sticky { background: var(--yellow); border: 1.3px solid var(--ink); border-radius: 4px; padding: 6px 10px; font-size: 13px; transform: rotate(-1deg); box-shadow: 2px 2px 0 var(--yellow-s); }
.meta { font-size: 12.5px; color: var(--muted); }

.coverbox { aspect-ratio: 16 / 9; width: 100%; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--blue); }
.coverbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
.coverbox .ph { font-family: var(--f-display); font-weight: var(--dw); font-size: 48px; color: var(--blue-d); }
.desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.notepad { font-family: var(--f-body); font-size: 13.5px; line-height: 26px; padding: 0 12px; border: 1.3px solid var(--ink); border-radius: 8px; background: #fff linear-gradient(transparent 25px, var(--yellow-s) 25px) 0 0 / 100% 26px; white-space: pre-wrap; word-break: break-word; max-height: 158px; overflow: hidden; }
.bottomdeco { height: 1px; margin-top: 40px; }

.empty .wbody { padding: 30px 22px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.empty h3 { font-size: 22px; }
.empty p { margin: 0; max-width: 44ch; color: var(--muted); }
.group-h { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: var(--dw); font-size: 20px; margin: 30px 0 12px; }
.group-h:first-child { margin-top: 0; }

/* Modal window */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(111, 91, 103, .32); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(1200px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: 8px 8px 0 var(--cs); }
.modal.pop { animation: popin .25s cubic-bezier(.3,1.4,.6,1); }
@keyframes popin { from { transform: scale(.94); opacity: 0; } }

.links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chat { display: flex; flex-direction: column; gap: 10px; padding: 16px; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.gallery figure { margin: 0; background: var(--win); border: 1.5px solid var(--ink); padding: 8px 8px 6px; border-radius: 4px; box-shadow: 3px 3px 0 var(--cs); display: flex; flex-direction: column; gap: 6px; }

/* Form */
.form { display: flex; flex-direction: column; gap: 16px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.gal-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.gal-edit .it { display: flex; flex-direction: column; gap: 4px; }
.gal-edit .th { aspect-ratio: 1; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; position: relative; background: var(--checker); }

.gal-edit .th img { width: 100%; height: 100%; object-fit: cover; }
.gal-edit .th button { position: absolute; top: 4px; right: 4px; border: 1.2px solid var(--ink); border-radius: 6px; background: var(--win); padding: 0 6px; font-size: 12px; }
.gal-edit input { padding: 4px 8px; font-size: 12.5px; border-radius: 6px; border: 1.3px solid var(--ink); background: var(--win); width: 100%; }
.secs { display: flex; flex-direction: column; gap: 10px; }
.secs .s { display: grid; gap: 6px; padding: 10px; border: 1.5px dashed var(--ink); border-radius: 10px; background: var(--win); }
.secs .s .hd { display: flex; flex-wrap: wrap; gap: 6px; }
.secs .s .hd input { min-width: 140px; }
.secs .s .hd input { flex: 1; min-width: 0; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(60,40,52,.82); display: grid; place-items: center; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 84vh; border: 6px solid #fff; border-radius: 6px; }
.lightbox > div { display: flex; flex-direction: column; align-items: center; max-width: 100%; }
.lightbox p { color: #fff; text-align: center; margin: 12px 0 0; max-width: min(640px, 100%); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.lightbox .cnt { font-family: var(--f-pixel); font-size: 12px; opacity: .8; margin-left: 8px; }
.lb-nav, .lb-close { position: absolute; border: 1.5px solid var(--ink); background: var(--win); color: var(--fg); border-radius: 50%; display: grid; place-items: center; padding: 0; }
.lb-nav { top: 50%; width: 46px; height: 46px; margin-top: -23px; font-size: 26px; line-height: 1; }

.lb-nav.next { right: max(14px, env(safe-area-inset-right, 0px)); }
.lb-close { top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 38px; height: 38px; font-size: 15px; }
/* Pages */
.pg { display: flex; flex-direction: column; gap: 18px; }
/* switching between the 01 / 02 tabs: a soft fade that drifts in from the side of the tab you picked */

.pg.flip-prev { animation: tabPrev .38s cubic-bezier(.2,.8,.3,1); }
@keyframes tabNext { from { transform: translateX(28px); opacity: 0; filter: blur(3px); } }
@keyframes tabPrev { from { transform: translateX(-28px); opacity: 0; filter: blur(3px); } }
@media (prefers-reduced-motion: reduce) { .pg.flip-next, .pg.flip-prev { animation: none; } }
.pagetabs { display: flex; gap: 6px; margin-bottom: -19px; position: relative; z-index: 1; padding-left: 14px; }
.pagetabs button { border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 5px 16px 4px; background: var(--checker); font-family: var(--f-display); font-weight: var(--dw); font-size: 14px; color: var(--muted); }

.pagetabs .px { font-size: 11px; margin-right: 4px; }
.ap-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
.ap-foot .px { font-size: 13px; letter-spacing: .2em; }
.albumpage { position: relative; display: flex; flex-direction: column; gap: 20px; padding: 26px 8px 8px; }
.ap-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-inline: 6px; }

.ap-empty { min-height: 40vh; display: grid; place-items: center; text-align: center; color: var(--muted); gap: 8px; align-content: center; }

.ap-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.factrow > div { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }

.relgroup { display: flex; flex-direction: column; gap: 8px; }

.relgroup h5 { margin: 0; }
.relitem { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 8px; border-radius: 12px; background: var(--bg); }
.relwho { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 0; }
.relwho .av { width: 32px; height: 32px; border-radius: 50%; border: 1.3px solid var(--ink); background: var(--pink); overflow: hidden; display: grid; place-items: center; font-size: 13px; }
.relwho .av img { width: 100%; height: 100%; object-fit: cover; }
.relwho b { font-family: "Orbit", var(--f-body); font-weight: 400; font-size: 14px; }
.relx { color: var(--muted); }
.rellines { display: flex; flex-direction: column; gap: 2px; margin-left: auto; text-align: right; min-width: 0; }

.relrows { display: flex; flex-direction: column; gap: 8px; }
.relrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr) auto; gap: 6px; align-items: center; }
.relrow select, .relrow input { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--win); }
@media (max-width: 760px) { .relrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; } .relrow input { grid-column: 1 / 3; grid-row: 2; } .rellines { margin-left: 0; text-align: left; width: 100%; } }
.apick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }

/* Album: Instagram-style profile, highlights and 3-column grid */
.ig { display: flex; flex-direction: column; padding: 30px 4px 8px; max-width: 900px; margin: 0 auto; width: 100%; }
.ig-back { align-self: flex-start; border: 0; background: none; padding: 0; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ig-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(18px, 5vw, 56px); align-items: center; max-width: 700px; margin: 0 auto; width: 100%; }
.ig-ava { width: clamp(86px, 17vw, 150px); aspect-ratio: 1; border-radius: 50%; padding: 4px; background: conic-gradient(from 200deg, var(--pink-d), #E8B4C8, #B9A6E0, var(--pink-d)); }
.ig-ava > *, .ig-mini > * { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--win); overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, #F9D7E2, #E7DDF6); }

.ig-nm { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.ig-nm span { font-size: 13px; color: var(--muted); }
.ig-stats { display: flex; gap: clamp(16px, 4vw, 34px); margin: 10px 0; font-size: 14px; }
.ig-stats b { margin-right: 4px; }
.ig-bio { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.ig-bio small { display: block; color: var(--muted); font-size: 12.5px; }
.ig-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ig-btns .btn { background: var(--checker); border-color: transparent; font-weight: 600; }
.ig-hl { display: flex; gap: clamp(12px, 3vw, 26px); overflow-x: auto; padding: 24px 4px 4px; max-width: 700px; margin: 0 auto; width: 100%; scrollbar-width: none; }
.ig-hl button { flex: none; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 7px; border: 0; background: none; padding: 0; }
.ig-hl .r { width: 68px; height: 68px; border-radius: 50%; padding: 3px; border: 1.5px solid var(--line, #E6D3DA); display: block; }
.ig-hl .r > span { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 22px; background: var(--checker); }
.ig-hl .r img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig-hl .l { font-size: 12px; max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ig-tabs { display: flex; justify-content: center; gap: clamp(30px, 8vw, 60px); border-top: 1px solid var(--line, #E6D3DA); margin-top: 18px; }
.ig-tabs button { border: 0; border-top: 1.5px solid transparent; margin-top: -1px; background: none; padding: 13px 2px; font-family: "Orbit", var(--f-body); font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.ig-tabs button[aria-selected="true"] { color: var(--fg); border-top-color: var(--fg); }
.ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.ig-tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 0; overflow: hidden; background: var(--checker); }
.ig-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig-tile .pin { position: absolute; top: 6px; left: 7px; font-size: 13px; }
.ig-tile .multi, .ig-teaser .multi { position: absolute; top: 5px; right: 7px; font-size: 14px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
.ig-tile .ov { position: absolute; inset: 0; background: rgba(77, 63, 71, .38); color: #fff; display: grid; place-items: center; font-weight: 700; opacity: 0; transition: opacity .15s; }
.ig-tile:hover .ov, .ig-tile:focus-visible .ov { opacity: 1; }
.ig .ap-empty { min-height: 26vh; }
.ig-order { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--pink); font-size: 13.5px; }
.ig-grid.ordering .ig-tile { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ig-grid.ordering .ig-tile img { pointer-events: none; -webkit-user-drag: none; }
.ig-grid.ordering .ig-tile.dragging { opacity: .25; }
.ig-ghost { position: fixed; z-index: 70; pointer-events: none; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 28px rgba(60, 40, 52, .4); transform: scale(1.06); opacity: .95; }
.ig-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig-grid.ordering .ig-tile img { transition: transform .15s, opacity .15s; }
.ig-grid.ordering .ig-tile.sel { outline: 3px solid var(--pink-d); outline-offset: -3px; }
.ig-grid.ordering .ig-tile.sel img { transform: scale(.9); opacity: .75; }
.ig-tile .no { position: absolute; left: 6px; bottom: 6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: rgba(40, 30, 36, .6); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.ig-post .pmove { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 4px; background: rgba(40, 30, 36, .55); color: #fff; border-radius: 999px; padding: 2px 4px; font-size: 11.5px; }
.ig-post .pmove button { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #4D3F47; font-size: 10px; }

.ig-teaser { display: grid; gap: 12px; }

.ig-teaser .ig-strip button { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 0; overflow: hidden; background: var(--checker); }

/* post viewer */

.ig-post .dots2 { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; pointer-events: none; }

.ig-post .cnt { position: absolute; top: 10px; right: 10px; background: rgba(40, 30, 36, .55); color: #fff; font-size: 12px; padding: 1px 9px; border-radius: 999px; }
.ig-post .side { display: flex; flex-direction: column; min-height: 0; }

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function copy(text, okMsg = '복사했어요') {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); toast(ok ? okMsg : '복사가 막혔어요. 본문을 직접 선택해 복사해 주세요.');
  }
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return '저장 공간이 가득 찼어요. 안 쓰는 항목이나 이미지를 지운 뒤 다시 시도해 주세요.';
  if (c === 'too_large') return '이미지가 너무 커요(최대 20MB). 더 작은 파일을 골라 주세요.';
  if (c === 'unsupported_type') return '이 형식의 파일은 올릴 수 없어요. JPG, PNG, WEBP, GIF를 써 주세요.';
  if (c === 'timeout') return '인터넷이 느리거나 끊겨서 멈췄어요. 다시 시도해 주세요.';
  if (c === 'signed_out') return '로그인이 풀렸어요. 새로고침해서 다시 로그인해 주세요.';
  if (c === 'invalid_argument') return '저장하지 못했어요. 이 페이지에 쓰기 권한이 없거나 내용이 너무 길어요(항목당 약 250KB).';
  return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.' + (e?.message ? ` (${String(e.message).slice(0, 80)})` : '');
}

/* ---------- Cover ---------- */
// key = "site:<drawer>" for a drawer's cover, "char:<id>" for a character's own cover
function coverOf(key) {
  const [kind, id] = key.split(':');
  if (kind === 'site') { const c = site.covers?.[id]; return c && c.img ? { img: c.img, y: c.y ?? 50 } : null; }
  const x = byId('characters', id);
  return x?.cover ? { img: x.cover, y: x.coverY ?? 50 } : null;
}
function assetInUse(aid) {
  return Object.values(site.covers || {}).some(c => c?.img?.id === aid) || (site.stickers || []).includes(aid) ||
    Object.values(S).some(list => list.some(x => [x.avatar, x.cover, ...(x.gallery || []), ...(x.album || []).flatMap(postImgs), ...allWorldPhotos(x), x.albumHead?.avatar, ...(x.cast || []).flatMap(c => [c.avatar, c.albumHead?.avatar, ...(c.album || []).flatMap(postImgs)])].some(r => r?.id === aid)));
}
async function setCover(key, val) {
  const [kind, id] = key.split(':');
  const old = coverOf(key)?.img;
  if (kind === 'site') await saveSite({ covers: { ...(site.covers || {}), [id]: val } });
  else {
    await db.collection('characters').doc(id).update({ cover: val ? val.img : null, coverY: val ? val.y : 50, updatedAt: Date.now() });
    const x = byId('characters', id); if (x) { x.cover = val ? val.img : null; x.coverY = val ? val.y : 50; }
  }
  if (old && (!val || val.img.id !== old.id) && !assetInUse(old.id)) { try { await assets?.delete(old.id); } catch {} }
}
function coverBlock(key, cls = '') {
  const c = coverOf(key), editing = coverEdit?.key === key, y = editing ? coverEdit.y : c?.y ?? 50;
  const k = esc(key);
  const tools = !(canWrite && status === 'ok') ? '' : editing
    ? `<span class="hintpill">사진을 위아래로 드래그해서 맞춰 주세요</span><button class="btn sm" data-act="cover-cancel">취소</button><button class="btn sm primary" data-act="cover-save">위치 저장</button>`
    : `${assets ? `<label class="btn sm filebtn">${c ? '커버 바꾸기' : '＋ 커버 추가'}<input type="file" accept="image/*" id="cf_${k}" data-cover="${k}"></label>` : ''}${c ? `<button class="btn sm" data-act="cover-move" data-ckey="${k}">위치 조정</button><button class="btn sm danger ${coverArmed === key ? 'armed' : ''}" data-act="cover-remove" data-ckey="${k}">${coverArmed === key ? '한 번 더 누르면 삭제' : '지우기'}</button>` : ''}`;
  return `<div class="cover-band ${cls} ${editing ? 'moving' : ''} ${c ? '' : 'none'}">${c ? `<img src="${img(c.img)}" alt="" draggable="false" style="object-position:50% ${y}%">` : '<div class="cover-default" aria-hidden="true">♡ ✦ ♡ ✦ ♡</div>'}<div class="cover-tools">${tools}</div></div>`;
}
function renderCover() { const el = $('#cover'); if (el) el.innerHTML = coverBlock('site:' + view); }
function renderCovers() { renderCover(); if (sheet?.mode === 'view' && sheet.type === 'characters') renderSheet(); }
const FONTS = [

function applyFont(key) {

async function saveSite(patch) {

function subFilters() {

function applyFilter(list) {
  return list.filter(x => {
    if (filter.tag && !(x.tags || []).includes(filter.tag)) return false;
    if (filter.sub === 'all') return true;
    if (filter.sub === 'fav') return x.fav;
    if (view === 'characters') return kindOf(x) === filter.sub.slice(2);

const PROFILE_KEYS = ['avatar', 'tagline', 'birthday', 'gender', 'appearance', 'personality', 'speech', 'backstory'];
const completeness = x => Math.round(PROFILE_KEYS.filter(k => x[k] && String(x[k].id ?? x[k]).trim()).length / PROFILE_KEYS.length * 100);

function previewLines(body, n = 4) {

    if (m && !/^https?$/i.test(m[1])) {
      let i = names.indexOf(m[1]); if (i < 0) { names.push(m[1]); i = names.length - 1; }
      return `<div class="bub ${i % 2 ? 'r' : ''}"><b>${esc(m[1])}</b>${esc(m[2].replace(/\*/g, ''))}</div>`;

function renderList() {

function textOf(type, x) {
  return [x.name, x.nick, x.title, x.tagline, x.summary, x.body, x.note, x.personality, x.appearance, x.backstory, x.speech, x.extra, x.platform, x.bot, x.category,
    ...(x.tags || []), ...(x.sections || []).flatMap(s => [s.title, s.body]), ...(x.gallery || []).map(g => g.caption), ...(x.album || []).map(g => g.caption), ...(x.cast || []).flatMap(c => [c.name, c.tagline, c.appearance, c.personality, c.backstory, c.desc])].filter(Boolean).join(' ').toLowerCase();

function renderSearch() {
  const q = query.toLowerCase().trim();
  let out = '', hits = 0;
  for (const t of Object.keys(TYPES)) {
    const list = sorted(S[t].filter(x => textOf(t, x).includes(q)), t);
    if (!list.length) continue;
    hits += list.length;
    out += `<div class="group-h">${folder(t).replace('<svg', '<svg style="width:30px;height:24px"')}${TYPES[t].label} <span class="lbl-box">${list.length}</span></div><div class="grid ${t === 'characters' ? 'chars' : ''}">${list.map(x => cardFor(t, x)).join('')}</div>`;
  }
  return hits ? out : `<div class="win empty">${winbar('404')}<div class="wbody"><p>“${esc(query)}”와 맞는 기록이 없어요.</p></div></div>`;
}

const SPEAKER = /^\s*([^:：*\n]{1,24}?)\s*[:：]\s?(.*)$/;

// ids: the posts in the order they should show (newest-first, like the grid); stored reversed again
async function saveOrder(key, ids) {
  const o = albumOwner(); if (!o) return;
  const by = new Map(albumEntries(o.x, key).map(e => [e.g.id, e.g]));
  const disp = ids.map(id => by.get(id)).filter(Boolean);
  if (disp.length !== by.size) return;
  try { await o.save(albumPatch(key, JSON.parse(JSON.stringify(disp.reverse())))); }
  catch (e) { toast(errMsg(e)); }
}
async function movePost(key, from, to) {
  const ids = albumEntries(albumOwner().x, key).map(e => e.g.id), i = ids.indexOf(from), j = ids.indexOf(to);
  if (i < 0 || j < 0 || i === j) return;
  ids.splice(j, 0, ids.splice(i, 1)[0]);

}
// photos of one post: the first one is the post itself, so its framing travels with it when the order changes
const FRAME_KEYS = ['id', 'x', 'y', 'z', 'cx', 'cy', 'cz', 'tx', 'ty', 'tz'];
function reorderImgs(g, imgs) {
  const meta = Object.fromEntries(Object.entries(g).filter(([k]) => !FRAME_KEYS.includes(k) && k !== 'more'));
  const ref = r => Object.fromEntries(Object.entries(r).filter(([k]) => FRAME_KEYS.includes(k)));
  return { ...meta, ...ref(imgs[0]), more: imgs.slice(1).map(ref) };
}

/* Post viewer */
let igPost = null; // { wid, id, n: photo index inside the post, edit, armed }
function igFind() {
  const x = albumOwner()?.x; if (!x || !igPost) return null;

  return i < 0 ? null : { x, list, i, g: list[i] };
}
function openPost(wid, id) { igPost = { wid, id, n: 0 }; renderPost(); }

function stepPost(d) {

  if (imgs.length > 1 && igPost.n + d >= 0 && igPost.n + d < imgs.length) { igPost.n += d; renderPost(); return; }

  const l = albumList(f.x, albumKey()), k = l.findIndex(e => e.wid === igPost.wid && e.g.id === igPost.id), nx = l[k + d];

}

// edits one post of the open character's album and saves the whole album list
async function patchPost(fn) {
  const f = igFind(), o = albumOwner(); if (!f || !o) return;
  const list = JSON.parse(JSON.stringify(f.list));
  const res = fn(list, f.i);
  try { await o.save(albumPatch(igPost.wid, list)); } catch (e) { toast(errMsg(e)); return; }
  return res;
}
async function postOp(op) {
  const f = igFind(); if (!f) return;
  if (op !== 'del') igPost.armed = false;
  if (op === 'fav' || op === 'pin') { await patchPost((l, i) => { l[i][op] = !l[i][op]; }); renderPost(); return; }
  if (op === 'cap') { igPost.edit = true; renderPost(); return; }
  if (op === 'mvL' || op === 'mvR') {
    const n = igPost.n, to = n + (op === 'mvL' ? -1 : 1), imgs = postImgs(f.g).slice();
    if (to < 0 || to >= imgs.length) return;
    [imgs[n], imgs[to]] = [imgs[to], imgs[n]];
    const g2 = reorderImgs(f.g, imgs);
    await patchPost((l, i) => { l[i] = g2; igPost.id = g2.id; igPost.n = to; });
    renderPost(); return;
  }
  if (op === 'capcancel') { igPost.edit = false; renderPost(); return; }
  if (op === 'capsave') { const v = $('#pcap').value; await patchPost((l, i) => { l[i].caption = v; }); igPost.edit = false; renderPost(); toast('저장했어요'); return; }
  if (op === 'pos') {
    const n = igPost.n, r = postImgs(f.g)[n];
    openPosTool(r, 'album', async p => {
      await patchPost((l, i) => { if (n === 0) Object.assign(l[i], p); else Object.assign(l[i].more[n - 1], p); });
      toast('위치를 저장했어요'); renderPost();
    });
    return;
  }
  if (op === 'del') {
    if (!igPost.armed) { igPost.armed = true; renderPost(); return; }
    igPost.armed = false;
    const imgs = postImgs(f.g), n = igPost.n;
    let gone;
    if (imgs.length > 1) {
      // dropping one photo of a multi-photo post; when it is the first, the next photo takes over the post
      gone = await patchPost((l, i) => {
        const g = l[i];
        if (n > 0) { igPost.n = n - 1; return g.more.splice(n - 1, 1)[0].id; }
        const imgs = postImgs(g).filter((_, j) => j !== 0);
        l[i] = reorderImgs(g, imgs);
        igPost.id = l[i].id; igPost.n = 0;
        return g.id;
      });
    } else {
      gone = await patchPost((l, i) => l.splice(i, 1)[0].id);
      closePost();
    }
    if (gone && !assetInUse(gone)) { try { await assets.delete(gone); } catch {} }
    toast('뺐어요'); if (igPost) renderPost(); renderSheet();
  }
}

// Re-rendering recreates every <img>, and the browser blanks each one while it decodes again.
// Putting the old, already-decoded nodes back in place keeps photos steady when something else on screen changes.
function setHtmlKeepImgs(el, html) {
  const old = new Map();
  el.querySelectorAll('img').forEach(i => { if (i.complete && i.naturalWidth) { const k = i.getAttribute('src'); old.has(k) ? old.get(k).push(i) : old.set(k, [i]); } });
  el.innerHTML = html;
  if (!old.size) return;
  el.querySelectorAll('img').forEach(n => {
    const o = old.get(n.getAttribute('src'))?.shift();
    if (!o) return;
    for (const a of ['style', 'alt', 'class', 'draggable']) n.hasAttribute(a) ? o.setAttribute(a, n.getAttribute(a)) : o.removeAttribute(a);
    o.removeAttribute('loading');
    n.replaceWith(o);
  });
}

/* ---------- Images ---------- */
async function shrink(file) {
  // gifs keep their animation; anything else the browser can decode (heic on iPhone too) gets resized
  if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/webp', 0.88));
    return out && out.size < file.size ? out : file;
  } catch { return file; }
}
// a request that never answers (flaky mobile network, a stuck login refresh) becomes an error instead of waiting forever
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no({ code: 'timeout' }), ms))]);
async function uploadFiles(files) {
  const { data } = await withTimeout(sb.auth.getSession(), 15000);
  if (!data?.session) throw { code: 'signed_out' };
  const out = [];
  for (let i = 0; i < files.length; i++) {
    if (files.length > 1) toast(`사진 올리는 중 ${i + 1}/${files.length}…`);
    const blob = await withTimeout(shrink(files[i]), 30000).catch(() => files[i]);
    let r;
    try { r = await withTimeout(assets.upload(blob), 90000); }
    catch (e) { if (e?.code === 'too_large') throw e; r = await withTimeout(assets.upload(blob), 90000); } // one retry
    out.push({ id: r.id });
  }
  return out;
}

/* ---------- Backup: everything (records, settings, images) in one zip ---------- */
let backingUp = '';
function referencedAssetIds() {
  const ids = new Set();
  for (const t of Object.keys(TYPES)) for (const x of S[t]) for (const id of assetIdsOf(x)) ids.add(id);
  for (const c of Object.values(site.covers || {})) if (c?.img?.id) ids.add(c.img.id);
  for (const id of site.stickers || []) ids.add(id);
  return [...ids];
}
async function backup() {
  if (backingUp) return;
  if (!window.JSZip) { toast('압축 도구를 불러오지 못했어요. 새로고침해 주세요.'); return; }
  const setBusy = m => { backingUp = m; renderNav(); };
  try {
    const zip = new JSZip();
    const strip = list => list.map(({ id, ...rest }) => ({ id, data: rest }));
    zip.file('data.json', JSON.stringify({ app: 'rp-seorap', version: 1, exportedAt: new Date().toISOString(),
      collections: Object.fromEntries(Object.keys(TYPES).map(t => [t, strip(S[t])])), settings: site }, null, 1));
    const ids = referencedAssetIds(), missing = [];
    await ensureUrls(ids);
    const ext = { 'image/webp': 'webp', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/svg+xml': 'svg' };
    for (let i = 0; i < ids.length; i++) {
      setBusy(`사진 모으는 중… ${i + 1}/${ids.length}`);
      try {
        const r = await fetch(urlCache.get(ids[i]).u);
        if (!r.ok) { missing.push(ids[i]); continue; }
        const b = await r.blob();
        zip.file(`images/${ids[i]}.${ext[b.type] || 'bin'}`, b);
      } catch { missing.push(ids[i]); }
    }
    if (missing.length) zip.file('missing-images.txt', missing.join('\n'));
    setBusy('압축하는 중…');
    const blob = await zip.generateAsync({ type: 'blob' });
    const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `rp-seorap-backup-${stamp}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(missing.length ? `백업했어요 (사진 ${missing.length}장은 불러오지 못했어요)` : '백업 파일을 저장했어요');
  } catch (e) {
    toast('백업을 만들지 못했어요. 잠시 후 다시 시도해 주세요.');
  } finally { setBusy(''); }
}

const MIME = { webp: 'image/webp', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml' };
async function restore(file) {
  if (backingUp) return;
  const setBusy = m => { backingUp = m; renderNav(); };
  try {
    setBusy('파일 여는 중…');
    const zip = await JSZip.loadAsync(file);
    const df = zip.file('data.json');
    if (!df) { toast('RP 서랍장 백업 파일이 아니에요.'); return; }
    const data = JSON.parse(await df.async('string'));
    const files = zip.file(/^images\/[^/]+$/);
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      setBusy(`사진 올리는 중… ${i + 1}/${files.length}`);
      const name = files[i].name.slice(7), id = name.replace(/\.[^.]+$/, ''), type = MIME[name.split('.').pop().toLowerCase()] || 'application/octet-stream';
      const blob = new Blob([await files[i].async('arraybuffer')], { type });
      const { error } = await sb.storage.from('files').upload(`${uid}/${id}`, blob, { contentType: type, upsert: true });
      if (error) failed++;
    }
    setBusy('기록 옮기는 중…');
    const rows = [];
    for (const [coll, list] of Object.entries(data.collections || {})) for (const { id, data: d } of list) rows.push({ user_id: uid, coll, id, data: d, updated_at: new Date().toISOString() });
    if (data.settings && Object.keys(data.settings).length) rows.push({ user_id: uid, coll: 'settings', id: 'site', data: data.settings, updated_at: new Date().toISOString() });
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from('items').upsert(rows.slice(i, i + 200));
      if (error) throw error;
    }
    urlCache.clear();
    await db._load();
    toast(failed ? `불러왔어요 (사진 ${failed}장은 올리지 못했어요)` : `불러왔어요! 기록 ${rows.length}개, 사진 ${files.length}장`);
  } catch (e) {
    toast('백업을 불러오지 못했어요: ' + (e?.message || '알 수 없는 오류'));
  } finally { setBusy(''); }
}

/* ---------- 위치 조정: drag a photo inside its frame to choose which part shows ---------- */
// [framing key, tab label, frame shape, round?, hint]
const POS_TABS = {
  avatar: [['', '프로필', '4/5', false, '캐릭터를 열었을 때 크게 보이는 사진이에요.'], ['c', '목록 카드', '4/5', false, '캐릭터 목록 카드에 보이는 사진이에요.'], ['t', '동그란 칩', '1/1', true, '이름 옆 동그란 사진, 관계 칩에 보이는 사진이에요.']],
  cast: [['', '카드', '4/5', false, '등장인물 카드에 보이는 사진이에요.'], ['t', '동그란 칩', '1/1', true, '관계 칩에 보이는 동그란 사진이에요.']],
  wcover: [['', '세계관 페이지', '21/8', false, '세계관을 열었을 때 맨 위에 보이는 사진이에요.'], ['c', '목록 카드', '16/9', false, '세계관 목록 카드에 보이는 사진이에요.']],
  album: [['', '게시물', '4/5', false, '사진을 눌러 열었을 때 보이는 모습이에요.'], ['t', '격자', '1/1', false, '앨범 격자와 프로필 미리보기에 보이는 모습이에요.']],
  ighead: [['t', '앨범 헤더', '1/1', true, '앨범 맨 위 동그란 사진이에요.']],
  gallery: [['t', '갤러리', '1/1', false, '세계관 갤러리에 보이는 사진이에요.']],
};
function openPosTool(ref, tabsKey, done) {
  const tabs = POS_TABS[tabsKey] || POS_TABS.avatar;
  const P = Object.fromEntries(tabs.map(([k]) => [k, { ...(framing(ref, k) || { x: 50, y: 50, z: 1 }) }]));
  let mode = tabs[0][0], drag = null;
  const touched = new Set();
  const o = document.createElement('div');
  o.className = 'postool';
  o.innerHTML = `<div class="win c-pink"><div class="wbar"><span class="dots"><i></i><i></i><i></i></span><span class="wt">위치 조정</span></div>
    <div class="pt-body">
      ${tabs.length > 1 ? `<div class="pt-tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-ptab="${k}">${l}</button>`).join('')}</div>` : ''}
      <p class="pt-hint"></p>
      <div class="pt-frame"><img src="${img(ref)}" alt="" draggable="false"></div>
      <label class="pt-zoom"><span>확대</span><input type="range" min="1" max="3" step="0.05" value="1" aria-label="확대"><b></b></label>
      <div class="pt-btns"><button type="button" class="btn sm ghost" data-pt="reset">처음대로</button><span style="flex:1"></span><button type="button" class="btn sm" data-pt="cancel">취소</button><button type="button" class="btn sm primary" data-pt="ok">완료</button></div></div></div>`;
  document.body.appendChild(o);
  const frame = o.querySelector('.pt-frame'), im = frame.querySelector('img'), hint = o.querySelector('.pt-hint'), zoom = o.querySelector('.pt-zoom input'), zl = o.querySelector('.pt-zoom b');
  const paint = () => {
    const c = P[mode], tab = tabs.find(t => t[0] === mode);
    frame.style.aspectRatio = tab[2];
    frame.classList.toggle('round', tab[3]);
    im.style.cssText = frameStyle(c) || 'object-position:50% 50%';
    zoom.value = c.z; zl.textContent = `${c.z.toFixed(1)}배`;
    hint.textContent = tab[4] + ' 끌어서 옮기고, 아래 막대로 확대할 수 있어요.';
    o.querySelectorAll('[data-ptab]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.ptab === mode)));
  };
  paint();
  zoom.addEventListener('input', () => { P[mode].z = +zoom.value; touched.add(mode); paint(); });
  frame.addEventListener('pointerdown', e => { e.preventDefault(); frame.setPointerCapture(e.pointerId); const c = P[mode]; drag = { px: e.clientX, py: e.clientY, x: c.x, y: c.y, w: frame.clientWidth, h: frame.clientHeight }; });
  frame.addEventListener('pointermove', e => {
    if (!drag) return;
    const c = P[mode];
    // dragging the photo right reveals more of its left side, so the anchor moves the other way
    c.x = Math.max(0, Math.min(100, drag.x - (e.clientX - drag.px) / drag.w * 100));
    c.y = Math.max(0, Math.min(100, drag.y - (e.clientY - drag.py) / drag.h * 100));
    touched.add(mode); paint();
  });
  frame.addEventListener('pointerup', () => { drag = null; });
  o.addEventListener('click', e => {
    const tb = e.target.closest('[data-ptab]');
    if (tb) { mode = tb.dataset.ptab; paint(); return; }
    const b = e.target.closest('[data-pt]'); if (!b) return;
    e.stopPropagation();
    if (b.dataset.pt === 'reset') { P[mode] = { x: 50, y: 50, z: 1 }; touched.add(mode); paint(); return; }
    o.remove();
    if (b.dataset.pt === 'ok') {
      const out = {};
      // a framing you never touched keeps following the one above it (e.g. the round chip follows the list card)
      for (const [k] of tabs) {
        if (!touched.has(k)) continue;
        const c = P[k]; out[k + 'x'] = Math.round(c.x); out[k + 'y'] = Math.round(c.y); out[k + 'z'] = +c.z.toFixed(2);
      }
      done(out);
    }
  });
}

  async function load() {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('items').select('coll,id,data,updated_at').range(from, from + 999);
      if (error) throw dbError(error);
      all.push(...data);
      if (data.length < 1000) break;
    }
    Object.values(cache).forEach(m => m.clear());
    seen.clear();
    for (const r of all) { C(r.coll).set(r.id, r.data); seen.set(r.coll + '/' + r.id, r.updated_at); }
    loadedOnce = true;
    new Set([...Object.keys(cache), ...listeners.map(l => l.c)]).forEach(emit);
  }
  // patch: for update() the fields to merge; for set() null, and the whole new document is in data
  async function write(c, id, data, patch) {
    const key = c + '/' + id, base = C(c).get(id) || {};
    const { data: row, error: e1 } = await sb.from('items').select('data,updated_at').match({ coll: c, id }).maybeSingle();
    if (e1) throw dbError(e1);
    let out = data, merged = false;
    if (row && row.updated_at !== seen.get(key)) {
      out = patch ? merge(row.data, patch) : rebase(row.data, base, data);
      merged = true;
    }
    const { data: saved, error } = await sb.from('items').upsert({ user_id: uid, coll: c, id, data: out, updated_at: new Date().toISOString() }).select('updated_at').single();
    if (error) throw dbError(error);
    seen.set(key, saved?.updated_at);
    C(c).set(id, out); emit(c);
    if (merged && c !== 'settings') toast('다른 기기에서 바뀐 내용을 지키면서 저장했어요');
  }
  const listen = (c, id, cb) => { const l = { c, id, cb }; listeners.push(l); if (loadedOnce) cb(id ? snapDoc(c, id) : snapColl(c)); return () => listeners.splice(listeners.indexOf(l), 1); };
  const ref = (c, id) => ({
    id, path: `${c}/${id}`,
    get: async () => snapDoc(c, id),
    set: d => write(c, id, JSON.parse(JSON.stringify(d))),
    async update(p) { const cur = C(c).get(id); if (!cur) throw { code: 'invalid_argument', message: 'missing document' }; p = JSON.parse(JSON.stringify(p)); return write(c, id, merge(cur, p), p); },
    async delete() { const { error } = await sb.from('items').delete().match({ coll: c, id }); if (error) throw dbError(error); C(c).delete(id); seen.delete(c + '/' + id); emit(c); },
    onSnapshot: (cb, err) => listen(c, id, cb),
  });
  return {
    _load: load,
    doc(path) { const [c, id] = path.split('/'); return ref(c, id); },
    collection(c) { return { path: c, doc: id => ref(c, id || newId(20)), onSnapshot: (cb, err) => listen(c, null, cb) }; },
  };
}
function makeAssets() {
  return {
    async upload(blob) {
      const id = newId(32);
      const { error } = await sb.storage.from('files').upload(`${uid}/${id}`, blob, { contentType: blob.type || 'application/octet-stream', cacheControl: '31536000' });
      if (error) throw { code: /size|large/i.test(error.message) ? 'too_large' : 'unavailable', message: error.message };
      putThumb(id, blob).catch(() => {});
      return { id };
    },
    async delete(id) { await sb.storage.from('files').remove([`${uid}/${id}`, `${uid}/${id}_t`]); urlCache.delete(id); urlCache.delete(id + '_t'); return { deleted: true }; },
  };
}

// ---- thumbnails: a small webp next to each photo ("<id>_t"), listed in settings.thumbs
async function makeThumb(blob) {
  if (!/^image\/(jpeg|png|webp)$/.test(blob.type)) return null;
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/webp', 0.82));
}
let newThumbs = [], thumbSaveTimer = null;
async function putThumb(id, blob) {
  const t = await makeThumb(blob);
  if (!t) return false;
  const { error } = await sb.storage.from('files').upload(`${uid}/${id}_t`, t, { contentType: 'image/webp', cacheControl: '31536000', upsert: true });
  if (error) return false;
  newThumbs.push(id);
  clearTimeout(thumbSaveTimer);
  thumbSaveTimer = setTimeout(() => { const add = newThumbs; newThumbs = []; saveSite({ thumbs: [...new Set([...(site.thumbs || []), ...add])] }).catch(() => {}); }, 1500);
  return true;
}
let thumbJob = '';
async function backfillThumbs() {
  // photos uploaded before thumbnails existed get one, a few at a time in the background
  const skip = new Set(JSON.parse(sessionStorage.getItem('rp-nothumb') || '[]'));
  const todo = referencedAssetIds().filter(id => !hasThumb(id) && !skip.has(id));
  for (let i = 0; i < todo.length; i++) {
    thumbJob = `섬네일 만드는 중 ${i + 1}/${todo.length}`; renderNav();
    let ok = false;
    try {
      await ensureUrls([todo[i]]);
      const r = await fetch(urlCache.get(todo[i]).u);
      if (r.ok) ok = await putThumb(todo[i], await r.blob());
    } catch {}
    if (!ok) { skip.add(todo[i]); try { sessionStorage.setItem('rp-nothumb', JSON.stringify([...skip])); } catch {} }
  }
  thumbJob = ''; renderNav();
}

async function start(sessionUser) {
  uid = sessionUser.id;
  loadUrlCache();
  $('#login').hidden = true;
  db = makeDb(); assets = makeAssets(); canWrite = true;
  db.doc('settings/site').onSnapshot(s => { site = s.exists ? s.data() : {}; applyFont(site.font); if (!coverEdit?.key.startsWith('site:')) renderCover(); });
  for (const t of Object.keys(TYPES)) {
    db.collection(t).onSnapshot(snap => {
      S[t] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded[t] = true;
      if (sheet?.mode === 'edit' || sheet?.mode === 'kinds') renderNav(); else render();
    });
  }
  try { await db._load(); status = 'ok'; } catch (e) { status = 'offline'; loadError = e?.message || String(e); console.error(e); }
  render();
  if (status === 'ok') setTimeout(backfillThumbs, 4000);
  // pick up changes made on another device when this tab comes back
  let lastSync = Date.now();
  const resync = async () => {
    if (document.hidden || Date.now() - lastSync < 3000 || sheet?.mode === 'edit') return;
    lastSync = Date.now();
    try { await db._load(); } catch {}
  };
  document.addEventListener('visibilitychange', resync);
  window.addEventListener('pageshow', e => { if (e.persisted) resync(); });
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPw').value });
  btn.disabled = false;
  if (error) { $('#loginErr').textContent = /invalid/i.test(error.message) ? '이메일이나 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. 잠시 후 다시 시도해 주세요.'; return; }
  start(data.user);
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user);
  else { $('#login').hidden = false; $('#loginEmail').focus(); }
})();
